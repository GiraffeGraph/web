<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Back legs -->
  <rect x="22" y="26" width="3.5" height="11" rx="1.75" fill="#C4893A"/>
  <rect x="27" y="26" width="3.5" height="11" rx="1.75" fill="#B8793A"/>
  <!-- Body -->
  <rect x="10" y="18" width="22" height="11" rx="5" fill="#E9AE3F"/>
  <!-- Front legs -->
  <rect x="12" y="26" width="3.5" height="11" rx="1.75" fill="#C4893A"/>
  <rect x="17" y="26" width="3.5" height="11" rx="1.75" fill="#B8793A"/>
  <!-- Neck -->
  <path d="M17 28 C16 22 15 16 16 10" stroke="#E9AE3F" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="18" cy="8" rx="5.5" ry="4" fill="#F0C468"/>
